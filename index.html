<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) — skipped on localhost and when ga_opt_out is set -->
    <script>
      (function () {
        var GA_ID = '%GA_ID%';
        var isLocal =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var optedOut = localStorage.getItem('ga_opt_out') === '1';

        if (isLocal || optedOut) {
          window['ga-disable-' + GA_ID] = true;
          return;
        }

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="author" content="%SEO_AUTHOR%" />
    <link rel="canonical" href="%SEO_CANONICAL%" />
    <meta property="og:title" content="%SEO_OG_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_OG_URL%" />
    <meta property="og:type" content="website" />
    <title>%SEO_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
